<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Weather</title>
    <style>
      :root {
        color-scheme: light dark;
        --text: light-dark(#0f172a, #f1f5f9);
        --muted: light-dark(#64748b, #94a3b8);
        --panel: light-dark(#ffffff, #111827);
        --line: light-dark(#e2e8f0, #1f2937);
        --track: light-dark(#e2e8f0, #263244);
        --rain: light-dark(#2563eb, #60a5fa);
        --ink: #1b1b22;
        --goofy: "Chalkboard SE", "Comic Sans MS", "Segoe Print", ui-rounded, sans-serif;
        --radius: 22px;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; margin: 0; }
      body { background: transparent; color: var(--text); }
      .num { font-variant-numeric: tabular-nums; }

      .card {
        border-radius: var(--radius);
        overflow: hidden;
        background: var(--panel);
        border: 1px solid var(--line);
      }

      /* ---------- Hero ---------- */
      .hero {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        container: hero / inline-size;
        padding: 22px 22px 18px;
        color: #fff;
        text-shadow: 0 1px 3px rgba(8, 14, 30, 0.45);
        background: var(--sky);
        --burst: #fff;
      }
      .hero[data-sky="clear-day"] { --sky: linear-gradient(165deg, #0b4fd6 0%, #1e83f0 50%, #46b4ff 100%); }
      .hero[data-sky="clear-night"] { --sky: linear-gradient(165deg, #04061a 0%, #141b4d 55%, #3b2f80 100%); }
      .hero[data-sky="partly-cloudy-day"] { --sky: linear-gradient(165deg, #1552b8 0%, #3f86de 55%, #7db4ee 100%); }
      .hero[data-sky="partly-cloudy-night"] { --sky: linear-gradient(165deg, #080c1c 0%, #1c2850 55%, #3d4d7a 100%); }
      .hero[data-sky="cloudy-day"] { --sky: linear-gradient(165deg, #2b3648 0%, #4a5a72 55%, #73869f 100%); }
      .hero[data-sky="cloudy-night"] { --sky: linear-gradient(165deg, #0c1018 0%, #1f2838 55%, #384458 100%); }
      .hero[data-sky="fog-day"] { --sky: linear-gradient(165deg, #4b5663 0%, #707c8a 55%, #9aa4af 100%); }
      .hero[data-sky="fog-night"] { --sky: linear-gradient(165deg, #12161d 0%, #2a323d 55%, #47505c 100%); }
      .hero[data-sky^="drizzle"] { --sky: linear-gradient(165deg, #223044 0%, #3b4e67 55%, #5d7590 100%); }
      .hero[data-sky^="rain"] { --sky: linear-gradient(165deg, #121b29 0%, #26374e 55%, #425c7a 100%); }
      .hero[data-sky="snow-day"] { --sky: linear-gradient(165deg, #34507a 0%, #5f81ae 55%, #9dbbe0 100%); }
      .hero[data-sky="snow-night"] { --sky: linear-gradient(165deg, #0c1428 0%, #223558 55%, #44608c 100%); }
      .hero[data-sky^="thunder"] { --sky: linear-gradient(165deg, #0a0819 0%, #1f1742 55%, #3a2b68 100%); }
      /* Scorching hot under an open sky: the whole sky burns orange. */
      .hero[data-mood="melting"]:is([data-sky="clear-day"], [data-sky="partly-cloudy-day"]) {
        --sky: linear-gradient(165deg, #c92a0c 0%, #f2610a 50%, #ffa51f 100%);
        --burst: #ffe066;
      }

      /* ---------- Backdrop: the animated sky behind the hero (built in backdrop.ts) ---------- */
      .backdrop { position: absolute; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
      .backdrop > * { position: absolute; }
      .backdrop i, .backdrop b { position: absolute; display: block; }

      /* Sunburst, centred behind the buddy. */
      .bd-burst { right: -670px; top: -630px; width: 1600px; height: 1600px; animation: spin 90s linear infinite; }
      .bd-glow {
        right: -30px; top: 30px; width: 280px; height: 280px; border-radius: 50%;
        background: radial-gradient(closest-side, var(--burst), transparent);
        opacity: 0.4;
        animation: pulse 5s ease-in-out infinite;
      }
      @keyframes pulse { 50% { opacity: 0.2; transform: scale(1.18); } }

      /* A cloud (or a gust) crossing the hero. --w is its width, so it starts fully off screen. */
      .bd-cross { left: 0; width: 100%; animation: cross linear infinite; }
      .bd-cross svg { display: block; width: var(--w); overflow: visible; }
      .bd-gust { animation: gust 5s ease-in infinite; }
      .reverse { animation-direction: reverse; }
      @keyframes cross { from { transform: translateX(calc(-1 * var(--w))); } to { transform: translateX(100%); } }
      @keyframes gust { 0% { transform: translateX(calc(-1 * var(--w))); } 40%, 100% { transform: translateX(100%); } }

      /* Strips drawn twice side by side, scrolling by half their width for a seamless loop. */
      .bd-scroll { left: 0; width: 200%; animation: scroll linear infinite; }
      @keyframes scroll { to { transform: translateX(-50%); } }

      .bd-rain, .bd-snow, .bd-stars { inset: 0; }
      .bd-rain { --dx: -50px; --tilt: 5.5deg; }
      .bd-rain.heavy { --dx: -170px; --tilt: 18deg; }
      .bd-rain i { top: -15%; border-radius: 2px; background: linear-gradient(transparent, #fff); animation: rain linear infinite; }
      @keyframes rain {
        from { transform: translate(0, 0) rotate(var(--tilt)); }
        to { transform: translate(var(--dx), 540px) rotate(var(--tilt)); }
      }

      .bd-snow i, .bd-snow b { top: -8%; animation: snow linear infinite; }
      .bd-snow i { border-radius: 50%; background: #fff; }
      .bd-snow b svg { display: block; animation: spin 7s linear infinite; }
      @keyframes snow {
        25% { transform: translate(16px, 135px); }
        50% { transform: translate(-8px, 270px); }
        75% { transform: translate(14px, 405px); }
        to { transform: translate(-6px, 540px); }
      }
      .bd-drift { left: 0; bottom: -2px; width: 100%; height: 24px; }

      .bd-stars i { width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
      .bd-stars svg { position: absolute; animation: sparkle 3.4s ease-in-out infinite; }
      .bd-shoot {
        width: 120px; height: 2.5px; border-radius: 2px; opacity: 0;
        background: linear-gradient(90deg, #fff, transparent);
        animation: shoot ease-in infinite;
      }
      @keyframes twinkle { 50% { opacity: 0.2; } }
      @keyframes sparkle { 0%, 100% { transform: scale(0.4) rotate(0deg); opacity: 0.3; } 50% { transform: scale(1) rotate(45deg); opacity: 1; } }
      @keyframes shoot {
        0%, 84% { opacity: 0; transform: translate(0, 0) rotate(-24deg); }
        87% { opacity: 1; }
        100% { opacity: 0; transform: translate(-320px, 142px) rotate(-24deg); }
      }

      /* Lightning: the bolt and a flash over the whole sky share one timing. */
      .bd-bolt { top: -4px; height: 74%; opacity: 0; animation: strike linear infinite; }
      .bd-flash { inset: 0; background: #e9e4ff; opacity: 0; animation: skyflash linear infinite; }
      @keyframes strike { 0%, 13%, 100% { opacity: 0; } 1% { opacity: 1; } 3% { opacity: 0.15; } 5%, 10% { opacity: 1; } }
      @keyframes skyflash { 0%, 13%, 100% { opacity: 0; } 1% { opacity: 0.34; } 3% { opacity: 0.04; } 5% { opacity: 0.26; } }

      .place h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
      .place p { font-size: 13px; opacity: 0.85; margin-top: 2px; }

      .now { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 14px; }
      .reading { min-width: 0; }
      .now .temp { font-size: 76px; font-weight: 300; line-height: 1; letter-spacing: -0.04em; }
      .now .desc { font-size: 18px; font-weight: 650; margin-top: 6px; }
      .now .range { font-size: 14px; opacity: 0.85; margin-top: 3px; }
      /* The buddy's one-liner, as a hand-cut sticker. */
      .quip {
        display: inline-block;
        margin-top: 12px;
        padding: 4px 11px 5px;
        font-family: var(--goofy);
        font-size: 15px;
        font-weight: 700;
        line-height: 1.25;
        color: var(--ink);
        text-shadow: none;
        background: #fff;
        border: 2.5px solid var(--ink);
        border-radius: 14px 16px 13px 5px;
        box-shadow: 3px 4px 0 rgba(0, 0, 0, 0.28);
        transform: rotate(-2deg);
      }
      .scene {
        flex: none;
        width: 220px;
        margin: -10px -10px -4px 0;
        overflow: visible;
        filter: drop-shadow(0 6px 0 rgba(0, 0, 0, 0.16));
      }

      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0; list-style: none; }
      .stats li {
        padding: 10px 12px;
        border-radius: 14px;
        /* Dark glass, so the numbers stay readable over any sky. */
        background: rgba(13, 20, 38, 0.34);
        border: 1px solid rgba(255, 255, 255, 0.2);
        text-shadow: none;
      }
      .stats span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.8; }
      .stats strong { display: flex; align-items: center; gap: 4px; font-size: 17px; font-weight: 600; margin-top: 3px; }
      .stats svg { width: 14px; height: 14px; transition: transform 600ms ease; }

      /* ---------- Panels ---------- */
      .panel { padding: 16px 18px 18px; border-top: 1px solid var(--line); }
      .panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 10px; }

      .hourly { overflow-x: auto; scrollbar-width: thin; margin: 0 -18px; padding: 0 18px; }
      .hourly svg { display: block; }
      .hourly .t-label { font-size: 13px; font-weight: 600; fill: var(--text); }
      .hourly .h-label { font-size: 11px; fill: var(--muted); }
      .hourly .p-label { font-size: 10px; font-weight: 600; fill: var(--rain); }
      .hourly .p-bar { fill: var(--rain); opacity: 0.25; }
      .hourly .grid { stroke: var(--line); stroke-dasharray: 2 4; }

      .days { list-style: none; padding: 0; }
      .days li {
        display: grid;
        grid-template-columns: 52px 36px 38px 36px 1fr 36px;
        align-items: center;
        gap: 8px;
        padding: 7px 0;
        font-size: 15px;
      }
      .days li + li { border-top: 1px solid var(--line); }
      .days .day { font-weight: 600; }
      .days .icon { width: 36px; height: 36px; margin: -3px 0; }
      .days .icon svg { display: block; }
      .days .pop { font-size: 12px; font-weight: 600; color: var(--rain); }
      .days .lo { color: var(--muted); text-align: right; }
      .days .hi { font-weight: 600; }
      .bar { position: relative; height: 6px; border-radius: 3px; background: var(--track); }
      .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }

      .footer { padding: 10px 18px 14px; font-size: 11px; color: var(--muted); }
      .footer a { color: inherit; }

      .status { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 14px; }
      .status .spinner {
        width: 26px; height: 26px; margin: 0 auto 10px; border-radius: 50%;
        border: 3px solid var(--line); border-top-color: var(--rain);
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /* ---------- Icon motion ---------- */
      /* The sun's rays are drawn around (0, 0), so they spin around their own centre. */
      .spin { transform-origin: 0 0; animation: spin 30s linear infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .drop { animation: drop 1.1s ease-in infinite; }
      .drop.slow { animation-duration: 2.4s; }
      .flash { animation: flash 2.6s steps(1) infinite; }
      .zzz { animation: zzz 3.2s ease-in-out infinite; }
      .heat { animation: heat 2.2s ease-in-out infinite; }
      .sweat { animation: sweat 1.8s ease-in infinite; }
      .shiver { animation: shiver 0.14s linear infinite; }
      .blink { animation: blink 0.5s steps(1) infinite; }
      /* "Line boil": the hero drawing swaps between three wobbles, like a redrawn cartoon frame. */
      .boil { filter: url(#wobble-a); animation: boil 0.54s steps(1) infinite; }
      @keyframes float { 50% { transform: translateX(3px); } }
      @keyframes drop { from { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } to { transform: translateY(6px); opacity: 0; } }
      @keyframes flash { 0%, 100% { opacity: 1; } 8% { opacity: 0.25; } 12% { opacity: 1; } 16% { opacity: 0.4; } }
      @keyframes zzz { 0%, 100% { transform: translate(0, 2px); opacity: 0.3; } 50% { transform: translate(2px, -2px); opacity: 1; } }
      @keyframes heat { from { transform: translateY(5px); opacity: 0; } 35% { opacity: 1; } to { transform: translateY(-9px); opacity: 0; } }
      @keyframes sweat { from { transform: translateY(-2px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(10px); opacity: 0; } }
      @keyframes shiver { 0%, 100% { transform: translateX(-0.9px); } 50% { transform: translateX(0.9px); } }
      @keyframes blink { 50% { opacity: 0.25; } }
      @keyframes boil { 0% { filter: url(#wobble-a); } 33% { filter: url(#wobble-b); } 66% { filter: url(#wobble-c); } }

      .enter { animation: enter 500ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      @keyframes enter { from { opacity: 0; transform: translateY(6px); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }

      /* ---------- Shared bits of the other cards ---------- */
      .kicker { font-size: 14px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.9; }
      .when { font-size: 44px; font-weight: 650; line-height: 1.05; letter-spacing: -0.03em; margin-top: 2px; }
      .dot { display: inline-block; width: 11px; height: 11px; margin-right: 7px; border-radius: 50%; border: 2px solid #fff; }
      .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 12px; font-size: 11px; color: var(--muted); }
      .legend i { width: 10px; height: 10px; border-radius: 3px; margin-left: 8px; }
      .legend i:first-child { margin-left: 0; }
      .dry { --tone: #22c55e; }
      .risky { --tone: #f59e0b; }
      .wet { --tone: var(--rain); }
      .legend .dry, .legend .risky, .legend .wet { background: var(--tone); }

      /* ---------- compare_weather: forecasts side by side ---------- */
      .versus { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2px; background: var(--line); }
      .contender { position: relative; display: grid; }
      .badges { position: absolute; z-index: 1; top: 16px; right: 14px; display: flex; gap: 6px; }
      .badge {
        padding: 2px 9px 3px;
        font-family: var(--goofy);
        font-size: 12px;
        font-weight: 700;
        color: var(--ink);
        background: #ffd23f;
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.28);
        transform: rotate(3deg);
      }

      /* ---------- find_dry_window: hour-by-hour strips ---------- */
      .strips { display: grid; grid-template-columns: 46px 1fr; gap: 12px 8px; align-items: center; font-size: 13px; }
      .strips .day { font-weight: 600; align-self: end; padding-bottom: 4px; }
      .cells { display: grid; grid-template-columns: repeat(var(--cols), 1fr); }
      .cells.axis span { font-size: 10px; color: var(--muted); white-space: nowrap; }
      .cells i { position: relative; height: 44px; border-block: 2.5px solid transparent; }
      .cells b { position: absolute; inset: auto 1.5px 3px; height: max(4px, calc(var(--p) * 0.34px)); border-radius: 3px; background: var(--tone); }
      .cells .past b { opacity: 0.25; }
      /* A winning window: boxed in marker, with its rank on the corner. */
      .cells .win { background: color-mix(in srgb, #ffd23f 30%, transparent); border-block-color: light-dark(var(--ink), #ffd23f); }
      .cells .start { border-left: 2.5px solid light-dark(var(--ink), #ffd23f); border-radius: 9px 0 0 9px; }
      .cells .end { border-right: 2.5px solid light-dark(var(--ink), #ffd23f); border-radius: 0 9px 9px 0; }
      .cells .start.end { border-radius: 9px; }
      .cells em, .medal {
        display: grid;
        place-items: center;
        width: 20px;
        height: 20px;
        font: 700 12px/1 var(--goofy);
        color: var(--ink);
        background: #ffd23f;
        border: 2px solid var(--ink);
        border-radius: 50%;
      }
      .cells em { position: absolute; z-index: 1; top: -11px; left: -9px; }
      .windows { list-style: none; padding: 0; }
      .windows li { display: grid; grid-template-columns: 24px 36px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; }
      .windows li + li { border-top: 1px solid var(--line); }
      .windows .medal { width: 24px; height: 24px; font-size: 13px; }
      .windows .icon svg { display: block; }
      .windows strong { display: block; font-size: 15px; font-weight: 600; }
      .windows small { color: var(--muted); font-size: 12px; }
      .chance { padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #fff; background: var(--tone); }

      /* ---------- air_quality ---------- */
      .pollutants { list-style: none; padding: 0; }
      .pollutants li { display: grid; grid-template-columns: 52px 1fr 96px 84px; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; }
      .pollutants li + li { border-top: 1px solid var(--line); }
      .pollutants small { color: var(--muted); font-size: 12px; }
      .pollutants li > small { text-align: right; }
      .meter { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
      .meter i { height: 8px; border-radius: 4px; background: var(--track); }
      .air-bars { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 92px; padding-bottom: 18px; }
      .air-bars i { position: relative; height: 100%; }
      .air-bars b { position: absolute; inset: auto 0 0; height: max(5px, calc(var(--h) * 1%)); border-radius: 4px; background: var(--c); }
      .air-bars span { position: absolute; top: calc(100% + 4px); left: 0; font-size: 10px; font-style: normal; color: var(--muted); white-space: nowrap; }
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; font-size: 13px; }
      .chips li { padding: 5px 11px; border-radius: 999px; background: var(--track); }
      .chips small { color: var(--muted); }

      /* ---------- sun_times ---------- */
      .scene.arc { width: 260px; margin: -4px -6px 0 0; }
      .arc text { font: 600 11px ui-sans-serif, system-ui, sans-serif; fill: #fff; }
      .sun-days { list-style: none; padding: 0; }
      .sun-days li { display: grid; grid-template-columns: 46px 1fr 118px 68px 40px; align-items: center; gap: 10px; padding: 9px 0; font-size: 14px; }
      .sun-days li + li { border-top: 1px solid var(--line); }
      .sun-days .day, .sun-days .length { font-weight: 600; }
      .sun-days .times { color: var(--muted); font-size: 12px; text-align: right; }
      .sun-days .length { text-align: right; }
      .delta { font-size: 12px; font-weight: 600; text-align: right; }
      .delta.up { color: #16a34a; }
      .delta.down { color: light-dark(#c2410c, #fb923c); }
      .track { position: relative; height: 12px; border-radius: 6px; background: light-dark(#1e293b, #0b1120); overflow: hidden; }
      .track i { position: absolute; top: 0; bottom: 0; }
      .light { background: #ffd23f; }
      .golden { background: #ff8a1f; }
      .track .marker { width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 0 1.5px var(--ink); }
      .legend .light, .legend .golden { border-radius: 3px; }

      /* The hero adapts to its own width, so it also works in a narrow comparison column. */
      @container hero (max-width: 460px) {
        .stats { grid-template-columns: repeat(2, 1fr); }
        .now .temp { font-size: 60px; }
        .when { font-size: 30px; }
        .scene { width: 150px; }
        .scene.arc { width: 170px; }
        .quip { font-size: 13px; }
      }
      @media (max-width: 460px) {
        .sun-days li { grid-template-columns: 46px 1fr 68px 40px; }
        .sun-days .times { display: none; }
        .pollutants li { grid-template-columns: 48px 1fr 88px; }
        .pollutants li > small { display: none; }
      }
    </style>
  </head>
  <body>
    <!-- Hand-drawn wobble: three versions of the same filter with a different noise seed. -->
    <svg width="0" height="0" aria-hidden="true" style="position: absolute">
      <defs>
        <filter id="wobble-a" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="wobble-b" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <filter id="wobble-c" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="17" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
        </filter>
      </defs>
    </svg>
    <div id="root"><div class="card"><div class="status"><div class="spinner"></div>Checking the sky…</div></div></div>
    <!-- SCRIPT -->
  </body>
</html>
